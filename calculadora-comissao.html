const OPTIONS = [
  { id: "A", i: 0.25, r: 0.15 },
  { id: "B", i: 0.30, r: 0.10 },
];

const DEFAULTS = { A: "0", N: "0", M: "0", H: "0" };

function calc(o, { A, N, M, H }) {
  const actPartner = o.i * A;
  const actCompany = A - actPartner;
  const recPartnerM = o.r * M;
  const recCompanyM = M - recPartnerM;
  const recPartnerA = recPartnerM * 12;
  const recCompanyA = recCompanyM * 12;
  const y1Partner = actPartner + recPartnerA;
  const y1Company = actCompany + recCompanyA;
  const totPartnerH = actPartner + recPartnerM * H;
  const totCompanyH = actCompany + recCompanyM * H;
  const totRevH = A + M * H;
  const take = totRevH > 0 ? totPartnerH / totRevH : 0;
  return { actPartner, actCompany, recPartnerM, recCompanyM, recPartnerA, recCompanyA, y1Partner, y1Company,
           totPartnerH, totCompanyH, take, actPartnerParc: actPartner / N, actCompanyParc: actCompany / N };
}

function Line({ label, partner, company, strong }) {
  return (
    <div className={"ln" + (strong ? " strong" : "")}>
      <span className="ln-l">{label}</span>
      <span className="ln-s">{partner}</span>
      <span className="ln-t">{company}</span>
    </div>
  );
}

function LangSwitch({ lang, setLang }) {
  const langs = [["pt", "PT"], ["en", "EN"], ["es", "ES"]];
  return (
    <div className="langsw">
      {langs.map(([code, label]) => (
        <button
          key={code}
          className={"langbtn" + (lang === code ? " active" : "")}
          onClick={() => setLang(code)}
          aria-pressed={lang === code}
        >
          {label}
        </button>
      ))}
    </div>
  );
}

            <div className="fld"><span className="lab">{t.fldHorizon}</span>
              <input type="number" min={1} placeholder="1" value={H} onChange={(e) => setH(e.target.value)} />
            </div>
          </div>
          <div className="actions">
            <button className="btn" onClick={reset}>{t.reset}</button>
          </div>
        </div>

        <div className="cross">
          <span>
            {t.crossLead} <b>{t.crossMonths(cross)}</b>. {t.crossBody(t.optionName("A"), t.optionName("B"), betterLabel, Hn)}
          </span>
        </div>

        <div className="cols">
          {OPTIONS.map((o) => {
            const r = res[o.id];
            const isBest = techBetter === o.id;
            return (
              <div key={o.id} className={"card" + (isBest ? " best" : "")}>
                <div className="card-h">
                  <span className="t">{t.optionName(o.id)}</span>
                  <span className="tag">{pct(o.i)} / {pct(o.r)}</span>
                </div>
                <div className="card-b">
                  <div className="colhead"><span>{t.colLine}</span><span className="hs">{t.colPartner}</span><span className="ht">{t.colCompany}</span></div>

                  <div className="sec">{Nn > 1 ? t.secActivationInst(Nn) : t.secActivationOnce}</div>
                  <Line label={t.total} partner={usd(r.actPartner)} company={usd(r.actCompany)} strong />
                  {Nn > 1 && <Line label={t.perInstallment} partner={usd(r.actPartnerParc)} company={usd(r.actCompanyParc)} />}

                  <div className="sec">{t.secRecurringMonth}</div>
                  <Line label={t.recurringMonthLabel(pct(o.r))} partner={usd(r.recPartnerM)} company={usd(r.recCompanyM)} strong />

                  <div className="sec">{t.secRecurringYear}</div>
                  <Line label={t.twelveMonths} partner={usd(r.recPartnerA)} company={usd(r.recCompanyA)} strong />

                  <div className="foot">
                    <div className="box"><div className="k">{t.footY1Partner}</div><div className="v" style={{ color: "var(--brass)" }}>{usd(r.y1Partner)}</div></div>
                    <div className="box"><div className="k">{t.footY1Company}</div><div className="v" style={{ color: "var(--teal)" }}>{usd(r.y1Company)}</div></div>
                    <div className="box"><div className="k">{t.footHPartner(Hn)}</div><div className="v" style={{ color: "var(--brass)" }}>{usd(r.totPartnerH)}</div></div>
                    <div className="box"><div className="k">{t.footHCompany(Hn)}</div><div className="v" style={{ color: "var(--teal)" }}>{usd(r.totCompanyH)}</div></div>
                  </div>
                  <div style={{ marginTop: 8, fontSize: 11, color: "var(--sub)" }}>
                    {t.shareLabel(Hn)} <b style={{ fontFamily: "'IBM Plex Mono',monospace", color: r.take > 0.22 ? "var(--brick)" : "var(--ink)" }}>{(r.take * 100).toFixed(1)}%</b>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        <div className="panel" style={{ marginTop: 16, padding: 0, border: "none", background: "transparent" }}>
          <div className="callout">
            <b>{t.calloutTitle}</b> {t.calloutBody}
          </div>
        </div>

        <div className="footernote">{t.footerNote}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
