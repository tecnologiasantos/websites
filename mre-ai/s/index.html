<main>
  <section class="card" id="sp-loading" style="max-width:640px;margin:40px auto;text-align:center">
    <p class="muted" data-t="sp_loading">Opening the shortlist…</p>

  <section class="card" id="sp-gone" style="max-width:640px;margin:40px auto" hidden>

      <p class="muted small" id="sp-valid"></p>
      <p class="muted small" id="sp-panel"></p>
    </section>

    <section class="card">
      <div id="sp-list"></div>
      <div class="field" style="max-width:360px;margin-top:8px">
        <label for="sp-name" data-t="sp_name">Your name</label>
        <input id="sp-name" maxlength="100" autocomplete="name">
      </div>
      <div id="sp-msg" class="msg" hidden></div>
